<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connor Web</title>
    <script src="/uv.bundle.js" defer></script>
    <script src="/uv.config.js" defer></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #dee1e6;
        --bar: #f1f3f4;
        --tab: #dfe3e8;
        --active-tab: #fff;
        --line: #c7ccd3;
        --line-dark: #aeb5be;
        --ink: #202124;
        --muted: #5f6368;
        --blue: #1a73e8;
        --hover: #e8eaed;
        --page: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background: var(--bg);
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .chrome {
        display: grid;
        grid-template-rows: 38px 46px minmax(0, 1fr);
        width: 100vw;
        height: 100vh;
        background: var(--page);
      }

      .tabs-strip {
        display: flex;
        align-items: end;
        min-width: 0;
        padding: 6px 8px 0;
        background: var(--bg);
        user-select: none;
      }

      .tabs {
        display: flex;
        align-items: end;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .tab {
        position: relative;
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 24px;
        align-items: center;
        gap: 8px;
        width: min(238px, 24vw);
        min-width: 128px;
        height: 32px;
        padding: 0 6px 0 12px;
        border-radius: 9px 9px 0 0;
        color: var(--muted);
        background: var(--tab);
      }

      .tab + .tab {
        margin-left: 2px;
      }

      .tab[aria-selected="true"] {
        z-index: 1;
        color: var(--ink);
        background: var(--active-tab);
      }

      .tab:not([aria-selected="true"]):hover {
        background: #e8ebef;
      }

      .tab-favicon {
        display: grid;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, #1a73e8, #34a853);
        font-size: 10px;
        font-weight: 700;
      }

      .tab-title {
        overflow: hidden;
        font-size: 12px;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tab-close,
      .new-tab,
      .nav-button,
      .go-button {
        display: grid;
        place-items: center;
        color: var(--muted);
        background: transparent;
      }

      .tab-close {
        width: 22px;
        height: 22px;
        border-radius: 50%;
      }

      .tab-close:hover,
      .new-tab:hover,
      .nav-button:hover,
      .go-button:hover {
        background: var(--hover);
      }

      .new-tab {
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        margin: 0 0 1px 6px;
        border-radius: 50%;
      }

      svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .toolbar {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--active-tab);
      }

      .nav-button,
      .go-button {
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }

      .nav-button:disabled {
        cursor: default;
        opacity: 0.36;
      }

      .address {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        min-width: 0;
        height: 32px;
        padding: 0 12px;
        border-radius: 18px;
        background: var(--bar);
      }

      .address:focus-within {
        background: #fff;
        box-shadow: inset 0 0 0 1px var(--blue), 0 1px 4px rgba(32, 33, 36, 0.2);
      }

      .lock {
        position: relative;
        width: 12px;
        height: 10px;
        border: 2px solid #5f6368;
        border-radius: 2px;
      }

      .lock::before {
        position: absolute;
        top: -9px;
        left: 1px;
        width: 6px;
        height: 7px;
        border: 2px solid #5f6368;
        border-bottom: 0;
        border-radius: 8px 8px 0 0;
        content: "";
      }

      #addressInput {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 14px;
      }

      .content {
        position: relative;
        min-height: 0;
        overflow: hidden;
        background: #fff;
      }

      .home {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 26px;
        padding: 28px;
        background:
          radial-gradient(circle at 20% 20%, rgba(26, 115, 232, 0.12), transparent 28rem),
          radial-gradient(circle at 78% 74%, rgba(52, 168, 83, 0.11), transparent 26rem),
          #fff;
      }

      .home[hidden],
      .frame[hidden] {
        display: none;
      }

      .logo {
        display: grid;
        gap: 12px;
        justify-items: center;
      }

      .logo-mark {
        display: grid;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        place-items: center;
        color: #fff;
        background: conic-gradient(#4285f4 0 25%, #34a853 0 50%, #fbbc05 0 75%, #ea4335 0);
        box-shadow: 0 18px 42px rgba(60, 64, 67, 0.22);
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        color: #202124;
        font-size: clamp(2.7rem, 8vw, 5.8rem);
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1;
      }

      .home-search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        width: min(640px, 100%);
        height: 46px;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.18);
      }

      #homeInput {
        min-width: 0;
        padding: 0 18px;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 16px;
      }

      .home-search button {
        display: grid;
        place-items: center;
        color: var(--blue);
        background: transparent;
      }

      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 680px;
      }

      .quick-links button {
        min-width: 112px;
        padding: 10px 14px;
        border-radius: 18px;
        color: #3c4043;
        background: #f1f3f4;
      }

      .quick-links button:hover {
        background: #e8eaed;
      }

      .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 5;
        max-width: min(420px, calc(100vw - 32px));
        padding: 11px 14px;
        border: 1px solid var(--line-dark);
        border-radius: 8px;
        color: #202124;
        background: #fff;
        box-shadow: 0 8px 24px rgba(32, 33, 36, 0.24);
        font-size: 13px;
      }

      .toast[hidden] {
        display: none;
      }

      @media (max-width: 720px) {
        .chrome {
          grid-template-rows: 36px 44px minmax(0, 1fr);
        }

        .tabs-strip {
          padding-right: 4px;
          padding-left: 4px;
        }

        .tab {
          min-width: 106px;
          width: 42vw;
        }

        .toolbar {
          grid-template-columns: auto minmax(0, 1fr) auto;
          padding: 6px;
        }

        .nav-button[data-action="forward"] {
          display: none;
        }

        .home {
          padding: 20px;
        }

        .quick-links button {
          flex: 1 1 42%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="chrome">
      <section class="tabs-strip" aria-label="Tabs">
        <div class="tabs" id="tabs" role="tablist"></div>
        <button class="new-tab" id="newTab" type="button" aria-label="New tab" title="New tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </section>

      <form class="toolbar" id="addressForm">
        <button class="nav-button" type="button" data-action="back" aria-label="Back" title="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <button class="nav-button" type="button" data-action="forward" aria-label="Forward" title="Forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
        <label class="address" aria-label="Address">
          <span class="lock" aria-hidden="true"></span>
          <input id="addressInput" name="address" autocomplete="off" spellcheck="false" placeholder="Search or type a URL">
        </label>
        <button class="go-button" type="submit" aria-label="Go" title="Go">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </button>
      </form>

      <section class="content" id="content" aria-label="Browser content">
        <div class="home" id="homeScreen">
          <div class="logo">
            <div class="logo-mark" aria-hidden="true">C</div>
            <h1>Connor Web</h1>
          </div>
          <form class="home-search" id="homeForm">
            <input id="homeInput" autocomplete="off" spellcheck="false" placeholder="Search or type a URL">
            <button type="submit" aria-label="Go">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
            </button>
          </form>
          <div class="quick-links" aria-label="Quick links">
            <button type="button" data-url="https://duckduckgo.com">DuckDuckGo</button>
            <button type="button" data-url="https://youtube.com">YouTube</button>
            <button type="button" data-url="https://reddit.com">Reddit</button>
            <button type="button" data-url="https://discord.com">Discord</button>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script type="module">
      import { BareMuxConnection } from "/bare-mux/index.mjs";

      const HOME_URL = "connor://newtab";
      const WISP_URL = "wss://wisp.mercurywork.shop/";
      const tabsElement = document.querySelector("#tabs");
      const content = document.querySelector("#content");
      const homeScreen = document.querySelector("#homeScreen");
      const addressInput = document.querySelector("#addressInput");
      const addressForm = document.querySelector("#addressForm");
      const homeForm = document.querySelector("#homeForm");
      const homeInput = document.querySelector("#homeInput");
      const toast = document.querySelector("#toast");
      const navButtons = {
        back: document.querySelector('[data-action="back"]'),
        forward: document.querySelector('[data-action="forward"]')
      };

      let transportReady = null;
      let tabs = [createTab()];
      let activeTabId = tabs[0].id;

      function createTab(url = HOME_URL) {
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          title: "New Tab",
          url,
          history: [url],
          historyIndex: 0,
          frame: null
        };
      }

      function activeTab() {
        return tabs.find((tab) => tab.id === activeTabId) || tabs[0];
      }

      function normalizeAddress(value) {
        const input = value.trim();

        if (!input || input.toLowerCase() === "home") {
          return HOME_URL;
        }

        if (/^https?:\/\//i.test(input)) {
          return input;
        }

        if (/^[a-z0-9.-]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(input)) {
          return `https://${input}`;
        }

        return `https://duckduckgo.com/?q=${encodeURIComponent(input)}`;
      }

      function uvUrl(url) {
        return `${__uv$config.prefix}${__uv$config.encodeUrl(url)}`;
      }

      function titleForUrl(url) {
        if (url === HOME_URL) {
          return "New Tab";
        }

        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return "Connor Web";
        }
      }

      async function setupUltraviolet() {
        if (transportReady) {
          return transportReady;
        }

        transportReady = (async () => {
          if (!("serviceWorker" in navigator)) {
            throw new Error("This browser does not support service workers.");
          }

          await navigator.serviceWorker.register("/sw.js", { scope: __uv$config.prefix });
          const connection = new BareMuxConnection("/bare-mux/worker.js");
          await connection.setTransport("/epoxy/index.mjs", [{ wisp: WISP_URL }]);
        })();

        return transportReady;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          toast.hidden = true;
        }, 4200);
      }

      function ensureFrame(tab) {
        if (tab.frame) {
          return tab.frame;
        }

        const frame = document.createElement("iframe");
        frame.className = "frame";
        frame.title = tab.title;
        frame.referrerPolicy = "no-referrer";
        frame.hidden = true;
        content.append(frame);
        tab.frame = frame;
        return frame;
      }

      async function navigate(value, options = {}) {
        const tab = activeTab();
        const url = normalizeAddress(value);

        if (url === tab.url && !options.force) {
          return;
        }

        tab.url = url;
        tab.title = titleForUrl(url);

        if (options.replace) {
          tab.history[tab.historyIndex] = url;
        } else {
          tab.history = tab.history.slice(0, tab.historyIndex + 1);
          tab.history.push(url);
          tab.historyIndex = tab.history.length - 1;
        }

        render();

        if (url === HOME_URL) {
          return;
        }

        try {
          await setupUltraviolet();
          const frame = ensureFrame(tab);
          const nextSrc = uvUrl(url);

          if (frame.getAttribute("src") !== nextSrc) {
            frame.src = nextSrc;
          }
        } catch (error) {
          showToast(error.message || "Connor Web could not start Ultraviolet.");
        }

        render();
      }

      function switchTab(id) {
        if (id === activeTabId) {
          return;
        }

        activeTabId = id;
        render();
      }

      function moveHistory(delta) {
        const tab = activeTab();
        const nextIndex = tab.historyIndex + delta;

        if (nextIndex < 0 || nextIndex >= tab.history.length) {
          return;
        }

        tab.historyIndex = nextIndex;
        navigate(tab.history[nextIndex], { replace: true, force: true });
      }

      function openTab(url = HOME_URL) {
        const tab = createTab();
        tabs.push(tab);
        activeTabId = tab.id;
        render();

        if (url !== HOME_URL) {
          navigate(url);
        }
      }

      function closeTab(id) {
        const index = tabs.findIndex((tab) => tab.id === id);

        if (index === -1) {
          return;
        }

        const [removed] = tabs.splice(index, 1);
        removed.frame?.remove();

        if (!tabs.length) {
          tabs.push(createTab());
        }

        if (activeTabId === id) {
          activeTabId = tabs[Math.max(0, index - 1)].id;
        }

        render();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function render() {
        const tab = activeTab();

        tabsElement.innerHTML = tabs.map((item) => `
          <button class="tab" type="button" role="tab" data-tab-id="${item.id}" aria-selected="${item.id === activeTabId}">
            <span class="tab-favicon" aria-hidden="true">C</span>
            <span class="tab-title">${escapeHtml(item.title)}</span>
            <span class="tab-close" role="button" tabindex="-1" data-close-tab="${item.id}" aria-label="Close tab">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </span>
          </button>
        `).join("");

        addressInput.value = tab.url === HOME_URL ? "" : tab.url;
        navButtons.back.disabled = tab.historyIndex === 0;
        navButtons.forward.disabled = tab.historyIndex >= tab.history.length - 1;
        homeScreen.hidden = tab.url !== HOME_URL;

        tabs.forEach((item) => {
          if (item.frame) {
            item.frame.hidden = item.id !== activeTabId || item.url === HOME_URL;
          }
        });

        document.title = `${tab.title} - Connor Web`;
      }

      addressForm.addEventListener("submit", (event) => {
        event.preventDefault();
        navigate(addressInput.value);
      });

      homeForm.addEventListener("submit", (event) => {
        event.preventDefault();
        navigate(homeInput.value);
        homeInput.value = "";
      });

      tabsElement.addEventListener("click", (event) => {
        const close = event.target.closest("[data-close-tab]");
        const tab = event.target.closest("[data-tab-id]");

        if (close) {
          event.stopPropagation();
          closeTab(close.dataset.closeTab);
          return;
        }

        if (tab) {
          switchTab(tab.dataset.tabId);
        }
      });

      document.querySelector("#newTab").addEventListener("click", () => openTab());
      document.querySelector('[data-action="back"]').addEventListener("click", () => moveHistory(-1));
      document.querySelector('[data-action="forward"]').addEventListener("click", () => moveHistory(1));

      document.querySelector(".quick-links").addEventListener("click", (event) => {
        const target = event.target.closest("[data-url]");

        if (target) {
          navigate(target.dataset.url);
        }
      });

      render();
      setupUltraviolet().catch((error) => {
        showToast(error.message || "Connor Web could not start Ultraviolet.");
      });
    </script>
  </body>
</html>
